<!-- Modal cambiar -->
<div id="myModal" class="modal" [ngClass]="{'oculto':!mostrarCambio, '':mostrarCambio }">
    <div class="modal-content">
        <div style="display: flex; justify-content: flex-end; font-size: x-large;">
            <i class="fa-solid fa-xmark icerrar" (click)="verCambio(-1,'')"></i>
        </div>
        <div class="borderAbajo" style="display: flex; justify-content: center;">
            <div class="celda" style="width: 50%; display:flex; align-items:center; display: flex; align-items: center; border-right: none;">
                <span style="font-weight: bold; text-decoration: underline; width: 35%;">Usuario:</span> 
                <div class="col-3" style="width: 60%; margin-left: 2%;">
                    <input type="text" class="effect-1" [value]='datoCambio["usuario"]' [(ngModel)]="datoCambio['usuario']"
                    [ngClass]="{'changed': datoCambio['usuario']!=datoCambioCheck['usuario']}" style="width: 100%; height: 2rem; background: #ececec;">
                    <span class="focus-border"></span>
                </div>
            </div>
        </div>
        <div class="borderAbajo" style="display: flex; justify-content: center;">
            <div class="col-3 modalRes celda" style="display: flex; flex-direction: row; justify-content: center; align-items: center; width: 30%">
                <i class="fa-solid" [ngClass]="{'fa-circle-check verde':datoCambio['usuarios'], 'fa-circle-xmark rojo':!datoCambio['usuarios']}" style="font-size: larger; margin-right: 1%; cursor: pointer;" (click)="datoCambio['usuarios']=!datoCambio['usuarios']"></i> Gestion de usuarios
            </div>
            <div class="col-3 modalRes celda" style="border-right: none; display: flex; flex-direction: row; justify-content: center; align-items: center; width: 30%">
                <i class="fa-solid" [ngClass]="{'fa-circle-check verde':datoCambio['autos'], 'fa-circle-xmark rojo':!datoCambio['autos']}" style="font-size: larger; margin-right: 1%; cursor: pointer;" (click)="datoCambio['autos']=!datoCambio['autos']"></i> Gestion de autos
            </div>
        </div>
        <div style="display: flex;">
            <div class="celda borderAbajo" style="width: 50%; display:flex; align-items:center;">
                <span style="font-weight: bold; text-decoration: underline; width: 35%;">Contraseña:</span>
                <div class="col-3" style="width: 60%; margin-left: 2%;">
                    <input type="text" class="effect-1" [(ngModel)]="passwordCambio"
                    [ngClass]="{'changed': passwordCambio!=''}" style="width: 100%; height: 2rem; background: #ececec;">
                    <span class="focus-border"></span>
                </div>
            </div>
            <div class="celda borderAbajo" style="width: 50%; display:flex; align-items:center; border-right: none;">
                <span style="font-weight: bold; text-decoration: underline; width: 35%;">Repita contraseña:</span>
                <div class="col-3" style="width: 60%; margin-left: 2%;">
                    <input type="text" class="effect-1" [(ngModel)]="passwordCambio2"
                    [ngClass]="{'changed': passwordCambio2!=''}" style="width: 100%; height: 2rem; background: #ececec;">
                    <span class="focus-border"></span>
                </div>
            </div>
        </div>
        <div style="display: flex;">
            <div class="celda" style="width: 50%; display:flex; align-items:center;border-right: none;"></div>
            <div class="celda" style="width: 50%; display:flex; align-items:center; border-right: none; justify-content: flex-end;">
                <button class="boton border rounded botones" (click)="actualizar()">Actualizar</button>
            </div>
        </div>
    </div>
</div>

<div id="myModal" class="modal" [ngClass]="{'oculto':!mostrarCrearAdmin, '':mostrarCrearAdmin }">
    <div class="modal-content">
        <div style="display: flex; justify-content: flex-end; font-size: x-large;">
            <i class="fa-solid fa-xmark icerrar" (click)="crearUser('admin')"></i>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="col-3 modalRes" style="margin-bottom: 2%; width: 30%;">
                <label for="user">Usuario </label>
                <input type="text" class="effect-1" [(ngModel)]="userAdmin" style="width: 100%; height: 2rem; background: #ececec;">
                <span class="focus-border"></span>
            </div>
            <div class="col-3 modalRes" style="margin-bottom: 2%;  width: 30%">
                <label for="user">Contraseña</label>
                <input type="text" class="effect-1" [(ngModel)]="passwordAdmin" style="width: 100%; height: 2rem; background: #ececec;">
                <span class="focus-border"></span>
            </div>
            <div class="col-3 modalRes" style="display: flex; flex-direction: row; margin-bottom: 2%; align-items: center; width: 30%">
                <i class="fa-solid" [ngClass]="{'fa-circle-check verde':gestionUserAdmin, 'fa-circle-xmark rojo':!gestionUserAdmin}" style="font-size: larger; margin-right: 1%; cursor: pointer;" (click)="gestionUserAdmin=!gestionUserAdmin"></i> Gestion de usuarios
            </div>
            <div class="col-3 modalRes" style="display: flex; flex-direction: row; margin-bottom: 2%; align-items: center; width: 30%">
                <i class="fa-solid" [ngClass]="{'fa-circle-check verde':gestionAutosAdmin, 'fa-circle-xmark rojo':!gestionAutosAdmin}" style="font-size: larger; margin-right: 1%; cursor: pointer;" (click)="gestionAutosAdmin=!gestionAutosAdmin"></i> Gestion de autos
            </div>
        </div>
        <div style="width: 100%; display:flex; align-items:center; border-right: none; justify-content: center;">
            <button class="boton border rounded botones" (click)="crearAdmin()">Crear</button>
        </div>
    </div>
</div>
