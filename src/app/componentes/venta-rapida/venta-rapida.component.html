<div class="svh" style="flex-direction: column;">
    <div class="margin5 seccion">
        <div class="textRed titulo" style="font-weight: bold; text-transform: uppercase; font-size: xxx-large; margin-bottom: 5rem;">Venta rapida</div>
        <div style="width: 80%;">
            <div class="linea" style="width: 100%;">
                <div class="col-3" style="width: 100%;">
                    <label class="textBlue" for="nomapel">Matricula </label><span class="msg">{{alertas[0]}}</span>
                    <input class="effect-1" type="text" placeholder="Matricula" [(ngModel)]="campos[0]">
                    <span class="focus-border"></span>
                </div>
            </div>
            <div class="linea" style="width: 100%;">
                <div class="col-3" style="margin-bottom: 2%; width: 100%;">
                    <label class="textBlue">Descripcion </label><span class="msg">{{alertas[1]}}</span>
                    <div style="display: flex;">
                        <textarea class="effect-1" style="width: 100%; height: 100px;" placeholder="Descripcion" [(ngModel)]="campos[1]"></textarea>
                        <span class="focus-border"></span>
                    </div>
                </div>
            </div>
            <label>Imagenes del auto: </label><span class="msg">{{alertas[2]}}</span>
            <div style="margin-top: 2%; text-align: center; margin-bottom: 4%;">
                <span *ngFor="let src of sources">
                    <img id=foto{{src.id}} src="{{src.link}}" alt="" style="width: 100px;">
                    <!-- <span class="boton glass border rounded textWhite" style="position: relative; left: -10px; bottom: -5px; display: inline-block; width: 1rem; cursor: pointer;" (click)="cambiarOrden(src.id)">{{src.id}}</span> -->
                </span>
            </div>
            <input type="file" name="imagen" id="imagen" #imagen accept="image/*," multiple (change)="showImg($event)" style="margin-bottom: 2%;">
            <div style="text-align: end; width: 100%;">
                <form #form="ngForm">
                    <button class="boton border rounded botones envDatos" (click)="send(form)">Enviar datos del Auto</button>
                </form>
            </div>
        </div>
    </div>
</div>
